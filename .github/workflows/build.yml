name: Build Storyboard-Travel

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag (example: v1.1.1). Leave empty to skip version override.'
        required: false
        type: string

jobs:
  build-macos:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Update version
        if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && github.event.inputs.release_tag != '')
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION=${GITHUB_REF#refs/tags/v}
          elif [[ "${{ github.event.inputs.release_tag }}" == v* ]]; then
            VERSION=${{ github.event.inputs.release_tag }}
            VERSION=${VERSION#v}
          else
            echo "Invalid release_tag. Use format like v1.1.1"
            exit 1
          fi
          node scripts/sync-version.mjs "$VERSION"

      - name: Install dependencies
        run: npm ci

      - name: Download macOS ffmpeg for bundling
        run: |
          mkdir -p src-tauri/resources/ffmpeg
          # Download static ffmpeg & ffprobe (Intel, runs on Apple Silicon via Rosetta 2)
          curl -sL "https://evermeet.cx/ffmpeg/ffmpeg-125991-ga81b23a85ac.zip" -o /tmp/ffmpeg-macos.zip
          curl -sL "https://evermeet.cx/ffmpeg/ffprobe-125991-ga81b23a85ac.zip" -o /tmp/ffprobe-macos.zip
          unzip -o /tmp/ffmpeg-macos.zip -d src-tauri/resources/ffmpeg/
          unzip -o /tmp/ffprobe-macos.zip -d src-tauri/resources/ffmpeg/
          chmod +x src-tauri/resources/ffmpeg/ffmpeg src-tauri/resources/ffmpeg/ffprobe
          echo "ffmpeg binary type: $(file src-tauri/resources/ffmpeg/ffmpeg)"
          ls -lh src-tauri/resources/ffmpeg/ffmpeg src-tauri/resources/ffmpeg/ffprobe

      - name: Build application (Universal Binary)
        env:
          CC: ""
          CXX: ""
          QINIU_ACCESS_KEY: ${{ secrets.QINIU_ACCESS_KEY }}
          QINIU_SECRET_KEY: ${{ secrets.QINIU_SECRET_KEY }}
          QINIU_BUCKET: ${{ secrets.QINIU_BUCKET }}
          QINIU_DOMAIN: ${{ secrets.QINIU_DOMAIN }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: npx tauri build --target universal-apple-darwin

      - name: Rename macOS DMG
        run: |
          RELEASE_APP_NAME="Storyboard-Travel"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION=${GITHUB_REF#refs/tags/v}
          elif [[ "${{ github.event.inputs.release_tag }}" == v* ]]; then
            VERSION=${{ github.event.inputs.release_tag }}
            VERSION=${VERSION#v}
          else
            VERSION=$(node -p "require('./package.json').version")
          fi
          DMG_PATH=$(find src-tauri/target/universal-apple-darwin/release/bundle/dmg -name "*.dmg" | head -n 1)
          if [ -z "$DMG_PATH" ]; then
            echo "No DMG found under src-tauri/target/universal-apple-darwin/release/bundle/dmg"
            exit 1
          fi
          NEW_NAME="${RELEASE_APP_NAME}_${VERSION}_universal.dmg"
          NEW_PATH="$(dirname "$DMG_PATH")/$NEW_NAME"
          mv "$DMG_PATH" "$NEW_PATH"
          echo "Renamed to: $NEW_NAME"

      - name: Upload DMG to server (SCP)
        env:
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
        run: |
          DMG_PATH=$(find src-tauri/target/universal-apple-darwin/release/bundle/dmg -name "*.dmg" | head -n 1)
          if [ -z "$DMG_PATH" ]; then
            echo "No DMG found"
            exit 1
          fi
          echo "Uploading: $DMG_PATH"
          mkdir -p ~/.ssh
          echo "$SERVER_SSH_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          scp -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null "$DMG_PATH" root@47.108.237.10:/jy/uploads/app/
          echo "Uploaded: $(basename "$DMG_PATH")"
